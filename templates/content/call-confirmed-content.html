<!-- 
  Call Confirmed Content - For use with shared-layout.html
  
  This content file is designed to work with the shared-layout.html layout.
  It contains the Account Manager call confirmed notification content with appointment details.
  
  The layout provides: logo, heading, greeting, social media promotion, footer, and unsubscribe sections.
-->

<!-- Call Confirmed Information -->
<tr>
  <td style="padding: 0 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="left" style="padding: 20px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 24px;
              color: #f5f0eb;
              text-align: left;
            "
            class="body-text"
          >
            {{call_confirmed_message}}
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>
