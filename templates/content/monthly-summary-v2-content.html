<!--
  F07 Monthly activity summary (OP-1317). Alias: monthly-summary-v2.
  For use with oxen-layout. The layout provides the logo, the contact block, the sign-off and the legal footer.
  Variables: first_name, company_name, month_year, metrics (list of {this: text}), receipts_line (empty hides it), cta_url.
-->
<tr>
  <td style="padding: 0 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="left" style="padding: 24px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 26px;
              color: #f5f0eb;
              text-align: left;
            "
            class="body-text"
          >
            Hello{{#first_name}} {{.}}{{/first_name}},
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td style="padding: 0 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="left" style="padding: 16px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 26px;
              color: #f5f0eb;
              text-align: left;
            "
            class="body-text"
          >
            Here is the activity{{#company_name}} of {{.}}{{/company_name}} in {{month_year}}:
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td style="padding: 0 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="left" style="padding: 6px 0 0"><div class="gmail-blend-screen"><div class="gmail-blend-difference">
          {{#each metrics}}
          </div></div><div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 10px 0 0 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 26px;
              color: #f5f0eb;
              text-align: left;
            "
            class="body-text"
          >
            • {{this}}
          </p></div></div><div class="gmail-blend-screen"><div class="gmail-blend-difference">
          {{/each}}
        </div></div></td>
      </tr>
    </table>
  </td>
</tr>
{{#receipts_line}}<tr>
  <td style="padding: 0 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="left" style="padding: 16px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 26px;
              color: #f5f0eb;
              text-align: left;
            "
            class="body-text"
          >
            {{.}}
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>
{{/receipts_line}}
<tr><td style="height:16px;line-height:16px;font-size:0">&nbsp;</td></tr>
<!-- CTA: main button. No gmail-blend wrappers: dark label on a light pill (see CLAUDE.md). -->
<tr>
  <td align="center" style="padding: 0 40px 8px 40px" class="mobile-padding">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td class="btn-diamond" bgcolor="#c8c8c8"
          style="
            padding: 12px 32px;
            background-color: #c8c8c8;
            background-image: linear-gradient(
              135deg,
              #e8e8e8 0%,
              #c0c0c0 40%,
              #e0e0e0 50%,
              #a8a8a8 100%
            );
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
              0 2px 8px rgba(0, 0, 0, 0.3),
              inset 0 1px 0 rgba(255, 255, 255, 0.25);
          "
        >
          <a
            href="{{cta_url}}"
            style="
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 16px;
              font-weight: 600;
              color: #000;
              text-decoration: none;
              display: inline-block;
            "
            class="cta-button"
          >
            Go to my dashboard
          </a>
        </td>
      </tr>
    </table>
  </td>
</tr>
