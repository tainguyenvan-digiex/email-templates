<!--
  Authenticator app added - For use with oxen-layout.html

  Sent to the user when an authenticator app is set up on their account.
  Backend fills: first_name.
-->

<tr>
  <td style="padding: 0 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="center" style="padding: 24px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 26px;
              color: #f5f0eb;
              text-align: center;
            "
            class="body-text"
          >
            Hello{{#first_name}} {{.}}{{/first_name}},
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>
