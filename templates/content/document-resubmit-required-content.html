<!-- 
  Document Resubmit Required Content - For use with shared-layout.html
  
  This content file is designed to work with the shared-layout.html layout.
  It contains the document resubmission required notification content with reason and CTA button.
  
  The layout provides: logo, heading, greeting, social media promotion, footer, and unsubscribe sections.
-->

<!-- Resubmission Request -->
<tr>
  <td style="padding: 0px 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="left" style="padding: 20px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0;
              font-family: 'DM Sans', Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 24px;
              color: #F5F0EB;
              text-align: left;
            "
            class="body-text"
          >
            {{resubmission_request_message}}
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>
<!-- Info panel: same markup as the account details card of account-currency-opened (task 5, 2026-11-06). Rows keep their own text and styling. -->
<tr>
<td style="padding: 16px 40px 0px 40px" class="mobile-padding">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #12131b; border: 1px solid #231e20; border-radius: 12px; background-image: linear-gradient(#12131b, #12131b);">
<tr>
<td style="padding: 24px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="left" style="padding: 0 0 12px 0"><div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0;
              font-family: 'DM Sans', Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 24px;
              color: #F5F0EB;
              text-align: left;
            "
            class="body-text"
          >
            {{reason_label}} <b>{{reason}}</b>
          </p></div></div></td>
</tr>
</table>
</td>
</tr>
</table>
</td>
</tr>
<tr>
  <td style="padding: 0 40px 0px 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="left" style="padding: 16px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference">
          <p
            style="
              margin: 0 0 20px 0;
              font-family: 'DM Sans', Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 24px;
              color: #F5F0EB;
              text-align: left;
            "
            class="body-text"
          >
            {{cta_message}}
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>


<!-- CTA Button -->
<tr>
  <td style="padding: 0 40px 8px 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="center">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <td class="btn-diamond" bgcolor="#c8c8c8"
                style="
                  padding: 12px 32px;
                  background-color: #c8c8c8;
                        background-image: linear-gradient(
                          135deg,
                          #e8e8e8 0%,
                          #c0c0c0 40%,
                          #e0e0e0 50%,
                          #a8a8a8 100%
                        );
                        border-radius: 40px;
                        border: 1px solid rgba(255, 255, 255, 0.15);
                        box-shadow:
                          0 2px 8px rgba(0, 0, 0, 0.3),
                          inset 0 1px 0 rgba(255, 255, 255, 0.25);
                "
              >
                <a
                  href="{{cta_url}}"
                  style="
                    font-family: 'DM Sans', Arial, sans-serif;
                    font-size: 16px;
                    font-weight: 600;
                    color: #000;
                    text-decoration: none;
                    display: inline-block;
                  "
                >
                  {{cta_text}}
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
