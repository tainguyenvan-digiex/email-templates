<!--
  Account Opened Content - For use with oxen-layout.html

  This content file is designed to work with the oxen-layout.html layout.
  It confirms that a company's account is open. The Account Confirmation Letter PDF travels as an email
  attachment (not rendered here).

  The layout provides: silk-wave header, logo, sign-off, footer and legal sections.
  Static copy only: every param comes from templates/config/account-opened/{locale}.json.
-->

<!-- Welcome Message -->
<tr>
  <td style="padding: 0 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="center" style="padding: 20px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 24px;
              color: #f5f0eb;
              text-align: justify;
            "
            class="body-text"
          >
            {{welcome_message_1}}
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- Attachment + closing messages -->
<tr>
  <td style="padding: 0 40px 20px 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="center" style="padding: 20px 0 0">
          <div class="gmail-blend-screen"><div class="gmail-blend-difference"><p
            style="
              margin: 0 0 16px 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 24px;
              color: #f5f0eb;
              text-align: justify;
            "
            class="body-text"
          >
            {{attachment_message}}
          </p>
          <p
            style="
              margin: 0 0 16px 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 24px;
              color: #f5f0eb;
              text-align: justify;
            "
            class="body-text"
          >
            {{welcome_message_2}}
          </p>
          <p
            style="
              margin: 0 0 20px 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 24px;
              color: #f5f0eb;
              text-align: justify;
            "
            class="body-text"
          >
            {{welcome_message_3}}
          </p></div></div>
        </td>
      </tr>
    </table>
  </td>
</tr>
