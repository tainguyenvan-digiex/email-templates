<!--
  Compliance Request Created Content - For use with shared-layout.html

  This content file is designed to work with the shared-layout.html layout.
  It contains the compliance additional information request content.

  The layout provides: logo, heading, greeting, social media promotion, footer, and unsubscribe sections.
-->

<!-- Request Message -->
<tr>
  <td style="padding: 0 40px 0 40px" class="mobile-padding">
    <table
      role="presentation"
      cellspacing="0"
      cellpadding="0"
      border="0"
      width="100%"
    >
      <tr>
        <td align="left" style="padding: 20px 0 0">
          <p
            style="
              margin: 0 0 16px 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 500;
              line-height: 22px;
              color: #f5f0eb;
              text-align: left;
            "
            class="body-text"
          >
            {{request_message}}
          </p>
          <!-- The officer's own words. Conditional: requirementDocument is optional on create,
               so an empty one renders the fallback line instead of an empty quote box. -->
          {{#requirement_document}}
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
                 style="margin: 0 0 16px 0;">
            <tr>
              <td style="
                    padding: 16px 20px;
                    background-color: rgba(245, 240, 235, 0.06);
                    border-left: 3px solid #c8c8c8;
                    border-radius: 4px;
                  ">
                <p style="
                     margin: 0;
                     font-family: &quot;DM Sans&quot;, Arial, sans-serif;
                     font-size: 17px;
                     font-weight: 400;
                     line-height: 24px;
                     color: #f5f0eb;
                     text-align: left;
                     white-space: pre-line;
                   " class="body-text">{{.}}</p>
              </td>
            </tr>
          </table>
          {{/requirement_document}}


          <p
            style="
              margin: 0 0 16px 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 400;
              line-height: 22px;
              color: #f5f0eb;
              text-align: left;
            "
            class="body-text"
          >
            {{instructions}}
          </p>
          <p
            style="
              margin: 0 0 20px 0;
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 18px;
              font-weight: 400;
              line-height: 22px;
              color: #f5f0eb;
              text-align: left;
            "
            class="body-text"
          >
            {{support_message}}
          </p>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- CTA: view the compliance request on the web portal -->
<tr>
  <td align="center" style="padding: 0 40px 20px 40px" class="mobile-padding">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td bgcolor="#c8c8c8"
          style="
            padding: 12px 32px;
            background-color: #c8c8c8;
            background-image: linear-gradient(
              135deg,
              #e8e8e8 0%,
              #c0c0c0 40%,
              #e0e0e0 50%,
              #a8a8a8 100%
            );
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
              0 2px 8px rgba(0, 0, 0, 0.3),
              inset 0 1px 0 rgba(255, 255, 255, 0.25);
          "
        >
          <a
            href="{{cta_url}}"
            style="
              font-family: &quot;DM Sans&quot;, Arial, sans-serif;
              font-size: 16px;
              font-weight: 600;
              color: #000;
              text-decoration: none;
              display: inline-block;
            "
            class="cta-button"
          >
            {{cta_text}}
          </a>
        </td>
      </tr>
    </table>
  </td>
</tr>
